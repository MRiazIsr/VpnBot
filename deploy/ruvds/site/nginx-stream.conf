# SNI-маршрутизатор на RuVDS. Вариант E.
#
# Ключевое свойство: ssl_preread читает имя из ClientHello, НЕ расшифровывая
# соединение. Поэтому VPN-поток проходит через эту машину сырыми байтами —
# ни ключей Reality/TLS, ни расшифрованного трафика здесь нет. Терминация
# только на Hetzner.
#
# Файл подключается из /etc/nginx/nginx.conf на верхнем уровне:
#     include /etc/backhaul/nginx-stream.conf;
# именно на верхнем — блок stream не может лежать внутри http.

stream {
    log_format sni '$remote_addr [$time_local] sni=$ssl_preread_server_name '
                   'up=$upstream_addr $status $bytes_sent/$bytes_received';
    access_log /var/log/nginx/stream.log sni buffer=32k flush=5s;

    map $ssl_preread_server_name $backhaul_upstream {
        # Сайт-приманка: TLS терминируется локально, отдаётся статика.
        moskva.live         site_local;
        www.moskva.live     site_local;

        # VPN: сырой TCP уезжает в SSH-туннель на Hetzner, там sing-box.
        cdn.moskva.live     vpn_tunnel;

        # Всё непонятное — включая соединения вообще без SNI — видит сайт.
        # Так проверяющий, пришедший по IP, получает нормальную страницу,
        # а не обрыв соединения.
        default             site_local;
    }

    upstream site_local {
        server 127.0.0.1:8443;
    }

    upstream vpn_tunnel {
        # Локальный конец `ssh -L`, поднятого юнитом moskva-tunnel.service.
        server 127.0.0.1:14443;
        # Туннель может перезапускаться; не выбрасываем его из ротации
        # после первой же ошибки, иначе кратковременный разрыв превращается
        # в отказ на минуту.
        max_fails=0;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $backhaul_upstream;

        # Долгие сессии — это норма и для сайта, и для VPN.
        proxy_timeout 10m;
        proxy_connect_timeout 5s;
    }
}
