# Сайт-приманка moskva.live на RuVDS + обслуживание ACME.
# Подключается из блока http в /etc/nginx/nginx.conf.

# ── :80 ──────────────────────────────────────────────────────────────
# Отвечать на 80-м обязательно: сайт, у которого http:// молчит, выглядит
# подозрительно. Плюс здесь же проходят ACME-челленджи.
server {
    listen 80;
    listen [::]:80;
    server_name moskva.live www.moskva.live;

    # Сертификат самого сайта выпускается прямо здесь: домен указывает на эту
    # машину, поэтому HTTP-01 проходит локально, без участия Hetzner.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Челленджи для VPN-поддомена приходят сюда же (A-запись та же), но
# сертификат нужен на Hetzner — там он и используется. Поэтому challenge
# уезжает в туннель, а приватный ключ никогда не появляется на этой машине.
server {
    listen 80;
    listen [::]:80;
    server_name cdn.moskva.live;

    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:14480;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── :8443 (только loopback) ──────────────────────────────────────────
# Сюда stream-маршрутизатор отправляет всё, что не VPN. Наружу этот порт
# не слушает: попасть на него можно только через :443.
server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name moskva.live www.moskva.live;

    ssl_certificate     /etc/letsencrypt/live/moskva.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moskva.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/moskva.live;
    index index.html;
    charset utf-8;

    # Сайт статический: ни PHP, ни базы, ни форм. Ломать нечего.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /sitemap.xml {
        return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n<url><loc>https://moskva.live/</loc></url>\n<url><loc>https://moskva.live/transport.html</loc></url>\n<url><loc>https://moskva.live/districts.html</loc></url>\n<url><loc>https://moskva.live/about.html</loc></url>\n</urlset>\n";
        add_header Content-Type application/xml;
    }

    gzip on;
    gzip_types text/css text/html application/xml image/svg+xml;

    access_log /var/log/nginx/moskva.access.log;
}

# Соединение по IP или с чужим именем: отдаём тот же сайт, а не ошибку.
server {
    listen 127.0.0.1:8443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/moskva.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moskva.live/privkey.pem;
    root /var/www/moskva.live;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
